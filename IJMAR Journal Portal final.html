function revTab(){return'<div class="grid2"><div class="card stack"><h2>Register a reviewer</h2><div class="f"><label for="rg_n">Name *</label><input id="rg_n"></div><div class="f"><label for="rg_e">Email *</label><input id="rg_e"></div><div class="f"><label for="rg_p">Phone *</label><input id="rg_p"></div><div class="f"><label for="rg_d">Domain *</label><select id="rg_d">'+DOMAINS.map(d=>'<option>'+d+'</option>').join('')+'</select></div><div id="rg_err" class="err"></div><button class="btn p" data-act="regrev">Save reviewer</button><p class="hint">Saving creates the reviewer login. It is emailed when you forward a paper.</p></div><div class="card stack"><h2>Saved reviewers</h2><div class="tw"><table><tr><th>Name</th><th>Email</th><th>Phone</th><th>Domain</th></tr>'+S.reviewers.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.email)+'</td><td>'+esc(r.phone)+'</td><td>'+esc(r.domain)+'</td></tr>').join('')+'</table></div></div></div>';}
function repTab(ps){const by={};ps.forEach(p=>by[p.status]=(by[p.status]||0)+1);const pd=ps.filter(p=>p.invoice&&p.invoice.status==='Paid').reduce((a,p)=>a+p.invoice.total,0),pn=ps.filter(p=>p.invoice&&p.invoice.status!=='Paid').reduce((a,p)=>a+p.invoice.total,0);const days={};ps.forEach(p=>{const k=dt(p.day0);days[k]=(days[k]||0)+1;});const pub=ps.filter(p=>p.status==='Published'&&p.paidDay!=null);const avg=pub.length?Math.round(pub.reduce((a,p)=>a+(p.paidDay-p.day0),0)/pub.length):'n/a';

function editorPaper(p){

if(p.status==='Sent to Reviewers'||p.status==='Re-review'){act='<div class="card stack"><h2>With reviewers</h2>'+kv(p.reviewers.map(id=>[esc(R(id).name),cur.some(v=>v.rid===id)?'<span class="badge b-ok">Submitted</span>':'<span class="badge b-warn">Pending</span>']))+'<div class="hint">Round '+p.round+'. Reminders go out automatically before and after the due date.</div></div>';}
if(p.status==='Review Received'){const lines=[];r1.forEach(v=>v.toAuthor.split('\n').filter(x=>x.trim()).forEach(t=>lines.push({f:rvName(p,v.rid),t:t.trim()})));
act='<div class="card stack"><h2>Pass comments to the author</h2><p class="hint">Select the comments to send. The author sees "Reviewer 1" and "Reviewer 2" only, never names.</p>'+lines.map((l,i)=>'<label style="font-weight:400;display:flex;gap:8px"><input type="checkbox" class="cm" data-i="'+i+'" checked><span><b>'+esc(l.f)+':</b> '+esc(l.t)+'</span></label>').join('')+'<div class="f"><label for="e_note">Note to the author (optional)</label><textarea id="e_note"></textarea></div><button class="btn p" data-act="sendc" data-id="'+esc(p.id)+'">Send comments to author</button></div>';S._lines=lines;}
if(p.status==='Revision Received'){const rp=p.replies[p.replies.length-1];act='<div class="card stack"><h2>Author replied</h2><div class="banner info">'+esc(rp.text)+'</div><button class="btn p" data-act="fwdre" data-id="'+esc(p.id)+'">Forward reply to reviewers</button></div>';}
if(p.status==='Reviews Complete'){act='<div class="card stack"><h2>Final decision</h2><p class="hint">Both reviewers have given their final recommendation.</p><div class="f"><label for="d_c">Comment</label><textarea id="d_c"></textarea></div><div class="row"><button class="btn p" data-act="decide" data-id="'+esc(p.id)+'" data-d="acc">Accept</button><button class="btn d" data-act="decide" data-id="'+esc(p.id)+'" data-d="rej">Reject</button></div></div>';}
if(p.status==='Accepted')act='<div class="card"><div class="banner info">Accepted. Waiting for the author to upload the camera-ready paper.</div></div>';
if(p.status==='Camera-Ready Received'||p.status==='Changes Requested'){const lastc=p.trail.filter(t=>t.text.startsWith('Changes needed')).slice(-1)[0];act='<div class="card stack"><h2>Format the paper and enter the page count</h2>'+(p.status==='Changes Requested'&&lastc?'<div class="banner warn">'+esc(lastc.text)+'</div>':'')+'<p class="hint">Edit the Word file offline into the journal template, then upload it here. The system calculates the charge from the page count. Exchange '+(p.proof+1)+' of '+S.limits.maxProof+'.</p><div class="grid2"><div class="f"><label for="f_file">Formatted file (.doc, .docx)</label><input id="f_file" type="file"></div><div class="f"><label for="f_pages">Final page count</label><input id="f_pages" type="number" min="1" value="'+(p.pages||10)+'" data-in="fprev"></div></div><div id="fprev"></div><div class="f"><label for="f_ov">Change the amount (optional, in rupees)</label><input id="f_ov" type="number" min="0" data-in="fprev"></div><div class="f"><label for="f_why">Reason for the change (required when you change the amount)</label><input id="f_why"></div><div id="eerr" class="err"></div><button class="btn p" data-act="fmt" data-id="'+esc(p.id)+'">Send to author for proofreading</button></div>';}
if(p.status==='Proofreading')act='<div class="card"><div class="banner info">With the author for proofreading. Amount shown to the author: '+inr(p.override!=null?p.override:p.calc.total)+'.</div></div>';
if(p.status==='Payment Pending')act='<div class="card stack"><div class="banner warn">Invoice '+esc(p.invoice.no)+' created for '+inr(p.invoice.total)+'. Waiting for payment. The system verifies it automatically.</div></div>';
if(p.status==='Paid')act='<div class="card stack"><div class="banner ok">Payment verified automatically. You can publish the paper.</div><div class="row"><button class="btn g" data-act="publish" data-id="'+esc(p.id)+'">Publish online</button></div></div>';

if(p.status==='Comments Sent')act='<div class="card"><div class="banner info">Comments sent. Waiting for the author’s reply.</div></div>';
if(p.status==='Rejected')act='<div class="card"><div class="banner bad">Rejected. The author may resubmit under the same paper ID; Day 0 then restarts.</div></div>';
const a=p.author;
return'<div class="stack"><div class="row"><button class="btn" data-act="back">Back</button><h1>'+esc(p.title)+'</h1></div><div class="row"><span class="mono">'+esc(p.id)+'</span>'+stBadge(p.status)+(OWN[p.status]?dueTag(p):'')+orcBadge(p.orc)+'</div>'+banner(p,'Editor')+act+
'<div class="grid2"><div class="card"><h3>Author</h3>'+kv([['Name',esc(a.name)],['Email',esc(a.email)],['Institution',esc(a.inst)],['Department',esc(a.dept)],['City',esc(a.city)],['ORCID',orcBadge(p.orc)+'<br><span class="mono">'+esc(a.orcid)+'</span><br><span class="hint">orcid.org/'+esc(a.orcid)+(p.orc.status!=='Verified'?'. ORCID name: '+esc(p.orc.name||'none'):'')+'</span>']])+'</div><div class="card"><h3>Manuscript</h3>'+kv([['Journal',p.journal],['Domain',esc(p.domain)],['Keywords',esc(p.keywords)],['Day 0',dt(p.day0)],['Push-backs',p.pushbacks+' of '+S.limits.maxPushback],['Resubmissions',p.resub||0],['Similarity check',p.sim==null?'Not recorded':p.sim+'%']])+'<p style="margin-bottom:0">'+esc(p.abstract)+'</p></div></div>'+
(rv.length?'<div class="card stack"><h3>Reviews</h3>'+rs()+'</div>':'')+((p.archive&&p.archive.length)?'<div class="card stack"><h3>Archived reviews (earlier submission cycle)</h3>'+p.archive.map(v=>revBlock(p,v)).join('')+'</div>':'')+
'<div class="grid2"><div class="card"><h3>Files</h3>'+filesHtml(p)+'</div><div class="card"><h3>Full trail (editor view)</h3>'+trailHtml(p,'all')+'</div></div></div>';}
function revBlock(p,v){const sc=Array.isArray(v.sc)?v.sc:[];return'<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px"><div class="row"><b>'+esc(R(v.rid).name)+'</b><span class="badge b-info">Round '+v.round+'</span><span class="badge b-'+(v.rec==='Accept'?'ok':v.rec==='Reject'?'bad':'warn')+'">'+esc(v.rec)+'</span><span class="hint">'+dt(v.day)+'</span></div><div class="tw"><table>'+CRIT.map((c,i)=>'<tr><td>'+(i+1)+'. '+c+'</td><td><b>'+(sc[i]||'-')+'</b> / 5</td></tr>').join('')+'</table></div>'+kv([['To the authors',esc(v.toAuthor).replace(/\n/g,'<br>')],['Confidential to the editor',esc(v.toEd)]])+'</div>';}
